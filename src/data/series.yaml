# WDS series metadata. `order` controls the grouping order on /games/,
# `accent` the colour of the card rule and series badge.
# Adding a series here makes it available to any game YAML via its `id`.

- id: panzer-campaigns
  name: Panzer Campaigns
  order: 1
  accent: '#4a6b3c'
  blurb: >-
    Operational World War II battles at 1 km per hex and two-hour turns. The
    largest WDS series by far, and the one most companions are written for.
  wds_url: https://wargameds.com/panzer-campaigns/

- id: squad-battles
  name: Squad Battles
  order: 2
  accent: '#8b4a2f'
  blurb: >-
    Tactical infantry combat down to the individual squad and vehicle, from the
    Second World War through Vietnam and modern conflicts.
  wds_url: https://wargameds.com/squad-battles/
